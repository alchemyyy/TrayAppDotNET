name: Increment Build Numbers

on:
  workflow_dispatch:
    inputs:
      force_battery:
        description: Force BatteryTrayAppDotNET
        required: true
        default: false
        type: boolean
      force_brightness:
        description: Force BrightnessTrayAppDotNET
        required: true
        default: false
        type: boolean
      force_fan_control:
        description: Force FanControlTrayAppDotNET
        required: true
        default: false
        type: boolean
      force_network:
        description: Force NetworkTrayAppDotNET
        required: true
        default: false
        type: boolean
      force_volume:
        description: Force VolumeTrayAppDotNET
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: increment-build-numbers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  increment:
    name: Increment Needed Build Numbers
    runs-on: [self-hosted, Windows, X64, trayapp]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Increment And Commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
          TARGET_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [ "$TARGET_REF_TYPE" != "branch" ]; then
            echo "Run this workflow from a branch, not a ${TARGET_REF_TYPE} ref." >&2
            exit 1
          fi

          target_rows=(
            "BatteryTrayAppDotNET|Battery|BatteryTrayAppDotNET|BatteryTrayAppDotNET/buildnumber.txt|${{ inputs.force_battery }}"
            "BrightnessTrayAppDotNET|Brightness|BrightnessTrayAppDotNET|BrightnessTrayAppDotNET/buildnumber.txt|${{ inputs.force_brightness }}"
            "FanControlTrayAppDotNET|FanControl|FanControlTrayAppDotNET|FanControlTrayAppDotNET/buildnumber.txt|${{ inputs.force_fan_control }}"
            "NetworkTrayAppDotNET|Network|NetworkTrayAppDotNET|NetworkTrayAppDotNET/buildnumber.txt|${{ inputs.force_network }}"
            "VolumeTrayAppDotNET|Volume|VolumeTrayAppDotNET|VolumeTrayAppDotNET/buildnumber.txt|${{ inputs.force_volume }}"
          )

          changed_files_since_release() {
            local commit_range="$1"
            local path="$2"

            git log --name-only --format= "$commit_range" -- "$path" |
              sed 's#\\#/#g' |
              sed '/^[[:space:]]*$/d' |
              sort -u
          }

          git fetch --tags --force origin

          release_tag="$(gh release list --exclude-drafts --limit 100 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[0].tagName')"
          if [ -z "$release_tag" ] || [ "$release_tag" = "null" ]; then
            echo "No published non-draft release was found." >&2
            exit 1
          fi

          if ! base_commit="$(git rev-list -n 1 "$release_tag")" || [ -z "$base_commit" ]; then
            echo "Failed to resolve release tag to a commit: ${release_tag}" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$base_commit" HEAD; then
            echo "Latest published release tag '${release_tag}' is not an ancestor of HEAD." >&2
            exit 1
          fi

          commit_range="${base_commit}..HEAD"
          echo "Latest published release: ${release_tag} (${base_commit})"

          mapfile -t common_changed_files < <(changed_files_since_release "$commit_range" "TrayAppDotNETCommon")
          common_changed=false
          if [ "${#common_changed_files[@]}" -gt 0 ]; then
            common_changed=true
            echo "TrayAppDotNETCommon changed after ${release_tag}; all app build numbers will increment."
          fi

          selected_rows=()
          selected_paths=()
          version_names=()

          for target_row in "${target_rows[@]}"; do
            IFS='|' read -r target_name version_name target_folder build_number_path forced <<< "$target_row"

            mapfile -t app_changed_files < <(
              changed_files_since_release "$commit_range" "$target_folder" |
                grep -Fvx "$build_number_path" || true
            )

            auto_selected=false
            if [ "$common_changed" = "true" ] || [ "${#app_changed_files[@]}" -gt 0 ]; then
              auto_selected=true
            fi

            selected=false
            if [ "$forced" = "true" ] || [ "$auto_selected" = "true" ]; then
              selected=true
            fi

            if [ "$forced" = "true" ]; then
              echo "${target_name}: selected by force input."
            elif [ "$common_changed" = "true" ]; then
              echo "${target_name}: selected because TrayAppDotNETCommon changed."
            elif [ "${#app_changed_files[@]}" -gt 0 ]; then
              echo "${target_name}: selected because ${target_folder} changed."
            else
              echo "${target_name}: no relevant changes detected."
            fi

            if [ "$selected" = "true" ]; then
              selected_rows+=("$target_row")
              selected_paths+=("$build_number_path")
              version_names+=("$version_name")
            fi
          done

          if [ "${#selected_rows[@]}" -eq 0 ]; then
            echo "No app build numbers need to be incremented."
            exit 0
          fi

          for selected_row in "${selected_rows[@]}"; do
            IFS='|' read -r target_name version_name target_folder build_number_path forced <<< "$selected_row"

            if [ ! -f "$build_number_path" ]; then
              echo "Missing build number file: ${build_number_path}" >&2
              exit 1
            fi

            build_number_text="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$build_number_path")"
            if [[ ! "$build_number_text" =~ ^[0-9]+$ ]]; then
              echo "Invalid build number in ${build_number_path}: '${build_number_text}'" >&2
              exit 1
            fi

            if [ "$build_number_text" = "9223372036854775807" ]; then
              echo "Build number cannot be incremented further: ${build_number_path}" >&2
              exit 1
            fi

            next_build_number=$((10#$build_number_text + 1))
            printf '%s' "$next_build_number" > "$build_number_path"
            echo "${target_name}: ${build_number_text} -> ${next_build_number}"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${selected_paths[@]}"

          status="$(git status --porcelain -- "${selected_paths[@]}")"
          if [ -z "$status" ]; then
            echo "No selected build number files changed."
            exit 0
          fi

          version_names_csv=""
          for version_name in "${version_names[@]}"; do
            if [ -z "$version_names_csv" ]; then
              version_names_csv="$version_name"
            else
              version_names_csv="${version_names_csv}, ${version_name}"
            fi
          done

          git commit -m "Increment version: ${version_names_csv}"
          git push origin "HEAD:${TARGET_BRANCH}"
