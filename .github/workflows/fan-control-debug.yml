name: Fan Control Debug

on:
  push:
  pull_request:
    paths:
      - FanControlTrayAppDotNET/**
      - TrayAppDotNETCommon/**
      - Directory.Build.props
      - TrayAppDotNET.Parent.props
      - TrayAppDotNET.Parent.targets
      - .github/workflows/fan-control-debug.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: FanControlTrayAppDotNET Debug
    runs-on: [self-hosted, Windows, X64, trayapp]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Submodules are checked out manually below.
          # actions/checkout updates submodules before stale self-hosted runner
          # config can be cleared.
          submodules: false

      - name: Checkout Submodules
        run: |
          set -euo pipefail

          # Clear cached submodule config from reused self-hosted workspaces.
          # --checkout forces the recorded commit instead of merge/rebase.
          git submodule deinit --force --all
          git submodule sync --recursive
          git submodule update --init --force --checkout --recursive
          # Existing self-hosted workspaces may have shallow submodule repositories.
          git submodule foreach --recursive '
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow --tags
            fi
          '

      - name: Verify .NET SDK
        run: |
          set -euo pipefail

          command -v dotnet
          dotnet --info
          dotnet --list-sdks | grep -E '^10\.'

      - name: Restore
        run: dotnet restore "FanControlTrayAppDotNET/src/FanControlTrayAppDotNET.csproj" --disable-parallel -p:Platform=x64 -p:EnableWindowsTargeting=true

      - name: Build Debug
        # Debug artifacts are built for CI only, so avoid local app shutdowns
        # and publish side effects.
        # Keep uploaded debug artifacts small.
        run: |
          set -euo pipefail

          dotnet build "FanControlTrayAppDotNET/src/FanControlTrayAppDotNET.csproj" \
            --configuration Debug \
            --no-restore \
            --output ".artifacts/debug/FanControlTrayAppDotNET" \
            -p:Platform=x64 \
            -p:EnableWindowsTargeting=true \
            -p:SkipKillRunningInstance=true \
            -p:SkipPublishAfterBuild=true \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -p:ContinuousIntegrationBuild=true

      - name: Remove PDB Files
        run: |
          set -euo pipefail

          find ".artifacts/debug/FanControlTrayAppDotNET" -type f -name '*.pdb' -delete

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fan-control-tray-app-debug-${{ github.sha }}
          path: .artifacts/debug/FanControlTrayAppDotNET/**
          if-no-files-found: error
          retention-days: 14
