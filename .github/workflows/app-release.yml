name: App Release

# Builds (or carries forward) one app's release package. publish.yml calls it once per app of its release matrix;
# it can also be dispatched for a single app. App-specific settings come from the app catalog, apps.json.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App name from apps.json, for example FanControlTrayAppDotNET.
        required: true
        type: string
      package_artifact_name:
        description: Optional package artifact name.
        required: false
        type: string
      tray_version:
        description: Aggregate TrayAppDotNET version, passed through for consistency with publish runs.
        required: false
        type: string
      app_version:
        description: App version to embed when building. Defaults to the app's buildnumber.txt.
        required: false
        type: string
      source_ref:
        description: Optional commit or ref to package.
        required: false
        type: string
      reuse_previous_release:
        description: Download the latest published app asset instead of building.
        required: false
        default: false
        type: boolean
      installer_factory_artifact:
        description: Optional artifact holding a prebuilt installer factory executable.
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      package_artifact_name:
        required: false
        type: string
        default: ""
      tray_version:
        required: false
        type: string
        default: ""
      app_version:
        required: false
        type: string
        default: ""
      source_ref:
        required: false
        type: string
        default: ""
      reuse_previous_release:
        required: false
        type: boolean
        default: false
      installer_factory_artifact:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  release:
    name: ${{ inputs.app }} Release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
          # Only apps that build vendored code check out submodules, below.
          submodules: false

      - name: Add Git Bash To PATH
        shell: cmd
        run: |
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\bin
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\usr\bin

      - name: Describe App
        id: app
        env:
          APP_NAME: ${{ inputs.app }}
        run: python .github/scripts/publish.py --phase describe-app --app-name "$APP_NAME"

      - name: Checkout Submodules
        if: ${{ steps.app.outputs.checkout_submodules == 'true' && !inputs.reuse_previous_release }}
        run: |
          set -euo pipefail

          git submodule sync --recursive
          # --checkout forces the recorded commit instead of merge/rebase.
          git submodule deinit --force --all
          git submodule update --init --force --checkout --recursive
          git submodule foreach --recursive '
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow --tags
            fi
          '

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify Release Toolchain
        env:
          REQUIRES_MSVC: ${{ steps.app.outputs.requires_msvc == 'true' && !inputs.reuse_previous_release }}
        run: |
          set -euo pipefail

          command -v gh
          command -v python
          # The app build always needs dotnet, and the installer factory is built here when no installer
          # factory artifact was supplied.
          dotnet --info

          if [ "$REQUIRES_MSVC" = "true" ]; then
            vswhere_path='/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
            test -x "$vswhere_path"
            visual_studio_path="$("$vswhere_path" -latest -products '*' \
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
              -property installationPath)"
            test -n "$visual_studio_path"
          fi

      - name: Download Installer Factory
        if: ${{ inputs.installer_factory_artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.installer_factory_artifact }}
          path: .artifacts/installer-factory

      - name: Prepare Release Package
        # Inputs reach the script through the environment so no value is ever parsed as shell code.
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ steps.app.outputs.name }}
          APP_VERSION: ${{ inputs.app_version }}
          TRAY_VERSION: ${{ inputs.tray_version }}
          INSTALLER_FACTORY_ARTIFACT: ${{ inputs.installer_factory_artifact }}
          REUSE_PREVIOUS_RELEASE: ${{ inputs.reuse_previous_release }}
        run: |
          set -euo pipefail

          args_list=(
            ".github/scripts/publish.py"
            "--phase" "build-app-profile"
            "--profile" "release"
            "--app-name" "$APP_NAME"
            "--app-version" "$APP_VERSION"
            "--repo" "$GITHUB_REPOSITORY"
            "--output-root" ".artifacts/publish"
          )

          if [ -n "$TRAY_VERSION" ]; then
            args_list+=("--tray-version" "$TRAY_VERSION")
          fi

          if [ -n "$INSTALLER_FACTORY_ARTIFACT" ]; then
            args_list+=("--installer-factory" ".artifacts/installer-factory/TrayAppDotNETInstaller.exe")
          fi

          if [ "$REUSE_PREVIOUS_RELEASE" = "true" ]; then
            args_list+=("--reuse-latest")
          fi

          python "${args_list[@]}"

      - name: Upload Release Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package_artifact_name || format('{0}-tray-app-package-{1}', steps.app.outputs.slug, github.run_id) }}
          path: .artifacts/publish/release/packages/**
          if-no-files-found: error
          retention-days: 14
