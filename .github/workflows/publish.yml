name: Publish

on:
  workflow_dispatch:
    inputs:
      tray_app_dot_net_version:
        description: Aggregate TrayAppDotNET version. Defaults to latest published release + 1, minimum 100.
        required: false
        type: string
      release_tag:
        description: Release tag. Defaults to TrayAppDotNET_<version>.
        required: false
        type: string
      force_rebuild:
        description: Build every app even if latest release has equal/newer app asset.
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

env:
  TRAYAPP_PUBLISH_STAGE_ROOT: ${{ vars.TRAYAPP_PUBLISH_STAGE_ROOT || 'C:/actions-runners/trayappdotnet/_publish-staging' }}

jobs:
  release-battery:
    name: Battery Release
    uses: ./.github/workflows/battery-release.yml
    with:
      package_artifact_name: battery-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      force_rebuild: ${{ inputs.force_rebuild }}
      publish_staging_root: ${{ vars.TRAYAPP_PUBLISH_STAGE_ROOT || 'C:/actions-runners/trayappdotnet/_publish-staging' }}

  release-brightness:
    name: Brightness Release
    uses: ./.github/workflows/brightness-release.yml
    with:
      package_artifact_name: brightness-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      force_rebuild: ${{ inputs.force_rebuild }}
      publish_staging_root: ${{ vars.TRAYAPP_PUBLISH_STAGE_ROOT || 'C:/actions-runners/trayappdotnet/_publish-staging' }}

  release-fan-control:
    name: Fan Control Release
    uses: ./.github/workflows/fan-control-release.yml
    with:
      package_artifact_name: fan-control-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      force_rebuild: ${{ inputs.force_rebuild }}
      publish_staging_root: ${{ vars.TRAYAPP_PUBLISH_STAGE_ROOT || 'C:/actions-runners/trayappdotnet/_publish-staging' }}

  release-network:
    name: Network Release
    uses: ./.github/workflows/network-release.yml
    with:
      package_artifact_name: network-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      force_rebuild: ${{ inputs.force_rebuild }}
      publish_staging_root: ${{ vars.TRAYAPP_PUBLISH_STAGE_ROOT || 'C:/actions-runners/trayappdotnet/_publish-staging' }}

  release-volume:
    name: Volume Release
    uses: ./.github/workflows/volume-release.yml
    with:
      package_artifact_name: volume-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      force_rebuild: ${{ inputs.force_rebuild }}
      publish_staging_root: ${{ vars.TRAYAPP_PUBLISH_STAGE_ROOT || 'C:/actions-runners/trayappdotnet/_publish-staging' }}

  publish:
    name: Publish Draft Release
    runs-on: [self-hosted, Windows, X64, trayapp]
    needs:
      - release-battery
      - release-brightness
      - release-fan-control
      - release-network
      - release-volume
    environment: trayapp-release
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Add Git Bash To PATH
        shell: cmd
        run: |
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\bin
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\usr\bin

      - name: Collect Local Publish Package Staging
        id: collect-local-staging
        run: |
          set -euo pipefail

          python_bin="python"
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          fi

          "$python_bin" .github/scripts/publish.py \
            --phase collect-staged-profiles \
            --repo "$GITHUB_REPOSITORY" \
            --profiles release \
            --stage-root "$TRAYAPP_PUBLISH_STAGE_ROOT" \
            --input-root .artifacts/publish/collected

      - name: Download Package Artifacts
        if: ${{ steps.collect-local-staging.outputs.complete != 'true' }}
        uses: actions/download-artifact@v8
        with:
          pattern: "*-package-${{ github.run_id }}"
          path: .artifacts/publish/collected/release
          merge-multiple: true

      - name: Verify Release Toolchain
        run: |
          set -euo pipefail

          command -v gh
          if ! command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
            echo "python3 or python is required." >&2
            exit 1
          fi

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python_bin="python"
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          fi

          args_list=(
            ".github/scripts/publish.py"
            "--phase" "publish-release"
            "--repo" "$GITHUB_REPOSITORY"
            "--profiles" "release"
            "--input-root" ".artifacts/publish/collected"
          )

          if [ "${{ inputs.tray_app_dot_net_version }}" != "" ]; then
            args_list+=("--tray-version" "${{ inputs.tray_app_dot_net_version }}")
          fi

          if [ "${{ inputs.release_tag }}" != "" ]; then
            args_list+=("--release-tag" "${{ inputs.release_tag }}")
          fi

          "$python_bin" "${args_list[@]}"

      - name: Upload Aggregate Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tray-app-dot-net-conglomerate-builds-${{ github.run_id }}
          path: .artifacts/publish/collected/_release/TrayAppDotNET_*.zip
          if-no-files-found: error

      - name: Remove Intermediate Package Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package_suffix="-package-${GITHUB_RUN_ID}"

          while IFS=$'\t' read -r artifact_id artifact_name; do
            if [ -z "$artifact_id" ]; then
              continue
            fi

            echo "Deleting intermediate package artifact: ${artifact_name}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name | endswith(\"${package_suffix}\")) | [.id, .name] | @tsv"
          )

      - name: Clean Local Publish Package Staging
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail

          python_bin="python"
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          fi

          "$python_bin" .github/scripts/publish.py \
            --phase clean-staged-profiles \
            --repo "$GITHUB_REPOSITORY" \
            --stage-root "$TRAYAPP_PUBLISH_STAGE_ROOT"
