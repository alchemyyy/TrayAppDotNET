name: Publish

on:
  workflow_dispatch:
    inputs:
      force_apps:
        description: Comma-separated app names (from apps.json) to rebuild even without changes, e.g. FanControlTrayAppDotNET
        required: false
        default: ""
        type: string
      skip_apps:
        description: Comma-separated app names (from apps.json) to skip building; their latest published package is carried forward
        required: false
        default: ""
        type: string
      tray_app_dot_net_version:
        description: Aggregate TrayAppDotNET version. Defaults to latest published release + 1, minimum 200.
        required: false
        type: string
      release_tag:
        description: Release tag, TrayAppDotNET_<version> (the version endpoint accepts no other form). Defaults to TrayAppDotNET_<version>; given alone, it sets the version.
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: trayapp-publish
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  prepare:
    name: Plan Publish Versions
    needs: tests
    runs-on: windows-latest
    # This job also publishes the single shared installer factory, so it is not a plain planning job.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      included_apps: ${{ steps.plan.outputs.included_apps }}
      release_matrix: ${{ steps.plan.outputs.release_matrix }}
      installer_factory_artifact: installer-factory-${{ github.run_id }}

    steps:
      # The tests job checked out github.sha; planning (and therefore every build and the release) uses the same
      # commit, so a push to the branch while the tests run cannot ship untested code.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          submodules: false

      - name: Add Git Bash To PATH
        shell: cmd
        run: |
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\bin
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\usr\bin

      # The installer factory targets .NET Framework 4.8; global.json still selects the SDK that builds it.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify Publish Planning Toolchain
        run: |
          set -euo pipefail

          command -v gh
          command -v python
          dotnet --info

      - name: Plan App Actions
        id: plan
        # Inputs reach the script through the environment so no value is ever parsed as shell code.
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_APPS: ${{ inputs.force_apps }}
          SKIP_APPS: ${{ inputs.skip_apps }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          python .github/scripts/publish.py \
            --phase plan-publish \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --force-apps "$FORCE_APPS" \
            --skip-apps "$SKIP_APPS"

      - name: Build Installer Factory
        run: |
          set -euo pipefail

          python .github/scripts/publish.py \
            --phase build-installer-factory \
            --profile release \
            --output-root .artifacts/installer-factory

      - name: Upload Installer Factory Artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-factory-${{ github.run_id }}
          # Upload the stable copy only; the publish tree beneath it is a second copy.
          path: .artifacts/installer-factory/TrayAppDotNETInstaller.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: ${{ matrix.app.displayName }} Release
    needs: prepare
    if: ${{ needs.prepare.outputs.release_matrix != '[]' }}
    strategy:
      fail-fast: true
      matrix:
        # One entry per app the release carries, written by publish.py from the app catalog.
        app: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}
    uses: ./.github/workflows/app-release.yml
    with:
      app: ${{ matrix.app.name }}
      package_artifact_name: ${{ matrix.app.slug }}-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      app_version: ${{ format('{0}', matrix.app.version) }}
      reuse_previous_release: ${{ matrix.app.reuse }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      installer_factory_artifact: ${{ needs.prepare.outputs.installer_factory_artifact }}

  publish:
    name: Publish Draft Release
    runs-on: windows-latest
    needs:
      - prepare
      - release
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.release.result == 'success'
      }}
    environment: trayapp-release
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}
          submodules: recursive

      - name: Add Git Bash To PATH
        shell: cmd
        run: |
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\bin
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\usr\bin

      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-package-${{ github.run_id }}"
          path: .artifacts/publish/collected/release
          merge-multiple: true

      - name: Download Installer Factory
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.installer_factory_artifact }}
          path: .artifacts/installer-factory

      # Only rebuilds the .NET Framework 4.8 installer factory when the prepared artifact is missing.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify Release Toolchain
        run: |
          set -euo pipefail

          command -v gh
          command -v python
          dotnet --info

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDED_APPS: ${{ needs.prepare.outputs.included_apps }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TRAY_VERSION: ${{ inputs.tray_app_dot_net_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          args_list=(
            ".github/scripts/publish.py"
            "--phase" "publish-release"
            "--repo" "$GITHUB_REPOSITORY"
            "--profiles" "release"
            "--apps" "$INCLUDED_APPS"
            "--target" "$SOURCE_SHA"
            "--input-root" ".artifacts/publish/collected"
            "--installer-factory" ".artifacts/installer-factory/TrayAppDotNETInstaller.exe"
          )

          if [ -n "$TRAY_VERSION" ]; then
            args_list+=("--tray-version" "$TRAY_VERSION")
          fi

          # The endpoint only accepts TrayAppDotNET_<version>: publish.py rejects a tag that names another version than
          # the aggregate version, and takes the version from the tag when no version is given.
          if [ -n "$RELEASE_TAG" ]; then
            args_list+=("--release-tag" "$RELEASE_TAG")
          fi

          python "${args_list[@]}"

      - name: Upload Aggregate Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tray-app-dot-net-conglomerate-builds-${{ github.run_id }}
          path: |
            .artifacts/publish/collected/_release/TrayAppDotNET_*.zip
            .artifacts/publish/collected/_release/Installer_*.exe
          if-no-files-found: error

      - name: Remove Intermediate Package Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package_suffix="-package-${GITHUB_RUN_ID}"

          while IFS=$'\t' read -r artifact_id artifact_name; do
            if [ -z "$artifact_id" ]; then
              continue
            fi

            echo "Deleting intermediate package artifact: ${artifact_name}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name | endswith(\"${package_suffix}\")) | [.id, .name] | @tsv"
          )
