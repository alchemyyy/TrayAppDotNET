name: Publish

on:
  workflow_dispatch:
    inputs:
      force_battery:
        description: Force BatteryTrayAppDotNET
        required: true
        default: false
        type: boolean
      force_brightness:
        description: Force BrightnessTrayAppDotNET
        required: true
        default: false
        type: boolean
      force_fan_control:
        description: Force FanControlTrayAppDotNET
        required: true
        default: false
        type: boolean
      force_network:
        description: Force NetworkTrayAppDotNET
        required: true
        default: false
        type: boolean
      force_task_manager:
        description: Force TaskManagerTrayAppDotNET
        required: true
        default: false
        type: boolean
      force_volume:
        description: Force VolumeTrayAppDotNET
        required: true
        default: false
        type: boolean
      skip_battery:
        description: Skip BatteryTrayAppDotNET
        required: true
        default: false
        type: boolean
      skip_brightness:
        description: Skip BrightnessTrayAppDotNET
        required: true
        default: false
        type: boolean
      skip_fan_control:
        description: Skip FanControlTrayAppDotNET
        required: true
        default: false
        type: boolean
      skip_network:
        description: Skip NetworkTrayAppDotNET
        required: true
        default: false
        type: boolean
      skip_task_manager:
        description: Skip TaskManagerTrayAppDotNET
        required: true
        default: false
        type: boolean
      skip_volume:
        description: Skip VolumeTrayAppDotNET
        required: true
        default: false
        type: boolean
      tray_app_dot_net_version:
        description: Aggregate TrayAppDotNET version. Defaults to latest published release + 1, minimum 200.
        required: false
        type: string
      release_tag:
        description: Release tag. Defaults to TrayAppDotNET_<version>.
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: trayapp-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Plan Publish Versions
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      included_apps: ${{ steps.plan.outputs.included_apps }}
      battery_action: ${{ steps.plan.outputs.battery_action }}
      battery_version: ${{ steps.plan.outputs.battery_version }}
      brightness_action: ${{ steps.plan.outputs.brightness_action }}
      brightness_version: ${{ steps.plan.outputs.brightness_version }}
      fan_control_action: ${{ steps.plan.outputs.fan_control_action }}
      fan_control_version: ${{ steps.plan.outputs.fan_control_version }}
      network_action: ${{ steps.plan.outputs.network_action }}
      network_version: ${{ steps.plan.outputs.network_version }}
      task_manager_action: ${{ steps.plan.outputs.task_manager_action }}
      task_manager_version: ${{ steps.plan.outputs.task_manager_version }}
      volume_action: ${{ steps.plan.outputs.volume_action }}
      volume_version: ${{ steps.plan.outputs.volume_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          submodules: false

      - name: Add Git Bash To PATH
        shell: cmd
        run: |
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\bin
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\usr\bin

      - name: Verify Publish Planning Toolchain
        run: |
          set -euo pipefail

          command -v gh
          if ! command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
            echo "python3 or python is required." >&2
            exit 1
          fi

      - name: Plan App Actions
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BATTERY: ${{ inputs.force_battery }}
          FORCE_BRIGHTNESS: ${{ inputs.force_brightness }}
          FORCE_FAN_CONTROL: ${{ inputs.force_fan_control }}
          FORCE_NETWORK: ${{ inputs.force_network }}
          FORCE_TASK_MANAGER: ${{ inputs.force_task_manager }}
          FORCE_VOLUME: ${{ inputs.force_volume }}
          SKIP_BATTERY: ${{ inputs.skip_battery }}
          SKIP_BRIGHTNESS: ${{ inputs.skip_brightness }}
          SKIP_FAN_CONTROL: ${{ inputs.skip_fan_control }}
          SKIP_NETWORK: ${{ inputs.skip_network }}
          SKIP_TASK_MANAGER: ${{ inputs.skip_task_manager }}
          SKIP_VOLUME: ${{ inputs.skip_volume }}
        run: |
          set -euo pipefail

          python_bin="python"
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          fi

          git fetch --tags --force origin

          force_apps=()
          if [ "$FORCE_BATTERY" = "true" ]; then
            force_apps+=("BatteryTrayAppDotNET")
          fi
          if [ "$FORCE_BRIGHTNESS" = "true" ]; then
            force_apps+=("BrightnessTrayAppDotNET")
          fi
          if [ "$FORCE_FAN_CONTROL" = "true" ]; then
            force_apps+=("FanControlTrayAppDotNET")
          fi
          if [ "$FORCE_NETWORK" = "true" ]; then
            force_apps+=("NetworkTrayAppDotNET")
          fi
          if [ "$FORCE_TASK_MANAGER" = "true" ]; then
            force_apps+=("TaskManagerTrayAppDotNET")
          fi
          if [ "$FORCE_VOLUME" = "true" ]; then
            force_apps+=("VolumeTrayAppDotNET")
          fi

          skip_apps=()
          if [ "$SKIP_BATTERY" = "true" ]; then
            skip_apps+=("BatteryTrayAppDotNET")
          fi
          if [ "$SKIP_BRIGHTNESS" = "true" ]; then
            skip_apps+=("BrightnessTrayAppDotNET")
          fi
          if [ "$SKIP_FAN_CONTROL" = "true" ]; then
            skip_apps+=("FanControlTrayAppDotNET")
          fi
          if [ "$SKIP_NETWORK" = "true" ]; then
            skip_apps+=("NetworkTrayAppDotNET")
          fi
          if [ "$SKIP_TASK_MANAGER" = "true" ]; then
            skip_apps+=("TaskManagerTrayAppDotNET")
          fi
          if [ "$SKIP_VOLUME" = "true" ]; then
            skip_apps+=("VolumeTrayAppDotNET")
          fi

          force_apps_csv="$(IFS=,; echo "${force_apps[*]}")"
          skip_apps_csv="$(IFS=,; echo "${skip_apps[*]}")"
          args_list=(
            ".github/scripts/publish.py"
            "--phase" "plan-publish"
            "--repo" "$GITHUB_REPOSITORY"
            "--target" "HEAD"
            "--force-apps" "$force_apps_csv"
            "--skip-apps" "$skip_apps_csv"
          )

          "$python_bin" "${args_list[@]}"

  release_battery:
    name: Battery Release
    needs: prepare
    if: ${{ needs.prepare.outputs.battery_action != 'skip' }}
    uses: ./.github/workflows/battery-release.yml
    with:
      package_artifact_name: battery-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      app_version: ${{ needs.prepare.outputs.battery_version }}
      force_rebuild: ${{ inputs.force_battery }}
      reuse_previous_release: ${{ needs.prepare.outputs.battery_action == 'reuse' }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  release_brightness:
    name: Brightness Release
    needs: prepare
    if: ${{ needs.prepare.outputs.brightness_action != 'skip' }}
    uses: ./.github/workflows/brightness-release.yml
    with:
      package_artifact_name: brightness-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      app_version: ${{ needs.prepare.outputs.brightness_version }}
      force_rebuild: ${{ inputs.force_brightness }}
      reuse_previous_release: ${{ needs.prepare.outputs.brightness_action == 'reuse' }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  release_fan_control:
    name: Fan Control Release
    needs: prepare
    if: ${{ needs.prepare.outputs.fan_control_action != 'skip' }}
    uses: ./.github/workflows/fan-control-release.yml
    with:
      package_artifact_name: fan-control-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      app_version: ${{ needs.prepare.outputs.fan_control_version }}
      force_rebuild: ${{ inputs.force_fan_control }}
      reuse_previous_release: ${{ needs.prepare.outputs.fan_control_action == 'reuse' }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  release_network:
    name: Network Release
    needs: prepare
    if: ${{ needs.prepare.outputs.network_action != 'skip' }}
    uses: ./.github/workflows/network-release.yml
    with:
      package_artifact_name: network-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      app_version: ${{ needs.prepare.outputs.network_version }}
      force_rebuild: ${{ inputs.force_network }}
      reuse_previous_release: ${{ needs.prepare.outputs.network_action == 'reuse' }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  release_task_manager:
    name: Task Manager Release
    needs: prepare
    if: ${{ needs.prepare.outputs.task_manager_action != 'skip' }}
    uses: ./.github/workflows/task-manager-release.yml
    with:
      package_artifact_name: task-manager-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      app_version: ${{ needs.prepare.outputs.task_manager_version }}
      force_rebuild: ${{ inputs.force_task_manager }}
      reuse_previous_release: ${{ needs.prepare.outputs.task_manager_action == 'reuse' }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  release_volume:
    name: Volume Release
    needs: prepare
    if: ${{ needs.prepare.outputs.volume_action != 'skip' }}
    uses: ./.github/workflows/volume-release.yml
    with:
      package_artifact_name: volume-tray-app-package-${{ github.run_id }}
      tray_version: ${{ inputs.tray_app_dot_net_version }}
      app_version: ${{ needs.prepare.outputs.volume_version }}
      force_rebuild: ${{ inputs.force_volume }}
      reuse_previous_release: ${{ needs.prepare.outputs.volume_action == 'reuse' }}
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  publish:
    name: Publish Draft Release
    runs-on: windows-latest
    needs:
      - prepare
      - release_battery
      - release_brightness
      - release_fan_control
      - release_network
      - release_task_manager
      - release_volume
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (needs.release_battery.result == 'success' || needs.release_battery.result == 'skipped') &&
        (needs.release_brightness.result == 'success' || needs.release_brightness.result == 'skipped') &&
        (needs.release_fan_control.result == 'success' || needs.release_fan_control.result == 'skipped') &&
        (needs.release_network.result == 'success' || needs.release_network.result == 'skipped') &&
        (needs.release_task_manager.result == 'success' || needs.release_task_manager.result == 'skipped') &&
        (needs.release_volume.result == 'success' || needs.release_volume.result == 'skipped')
      }}
    environment: trayapp-release
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_sha }}
          submodules: recursive

      - name: Add Git Bash To PATH
        shell: cmd
        run: |
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\bin
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\usr\bin

      - name: Download Package Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-package-${{ github.run_id }}"
          path: .artifacts/publish/collected/release
          merge-multiple: true

      - name: Verify Release Toolchain
        run: |
          set -euo pipefail

          command -v gh
          if ! command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
            echo "python3 or python is required." >&2
            exit 1
          fi

      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDED_APPS: ${{ needs.prepare.outputs.included_apps }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          python_bin="python"
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          fi

          args_list=(
            ".github/scripts/publish.py"
            "--phase" "publish-release"
            "--repo" "$GITHUB_REPOSITORY"
            "--profiles" "release"
            "--apps" "$INCLUDED_APPS"
            "--target" "$SOURCE_SHA"
            "--input-root" ".artifacts/publish/collected"
          )

          if [ "${{ inputs.tray_app_dot_net_version }}" != "" ]; then
            args_list+=("--tray-version" "${{ inputs.tray_app_dot_net_version }}")
          fi

          if [ "${{ inputs.release_tag }}" != "" ]; then
            args_list+=("--release-tag" "${{ inputs.release_tag }}")
          fi

          "$python_bin" "${args_list[@]}"

      - name: Upload Aggregate Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tray-app-dot-net-conglomerate-builds-${{ github.run_id }}
          path: .artifacts/publish/collected/_release/TrayAppDotNET_*.zip
          if-no-files-found: error

      - name: Remove Intermediate Package Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          package_suffix="-package-${GITHUB_RUN_ID}"

          while IFS=$'\t' read -r artifact_id artifact_name; do
            if [ -z "$artifact_id" ]; then
              continue
            fi

            echo "Deleting intermediate package artifact: ${artifact_name}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done < <(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.name | endswith(\"${package_suffix}\")) | [.id, .name] | @tsv"
          )
