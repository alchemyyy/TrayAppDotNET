name: Network Debug

on:
  push:
    branches: [main]
    paths: &paths
      - NetworkTrayAppDotNET/**
      - TrayAppDotNETCommon/**
      - Directory.Build.props
      - TrayAppDotNET.Apps.props
      - TrayAppDotNET.Parent.props
      - TrayAppDotNET.Parent.targets
      - apps.json
      - global.json
      - .github/scripts/publish.py
      - .github/workflows/_app-build.yml
      - .github/workflows/network-debug.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: NetworkTrayAppDotNET Debug
    uses: ./.github/workflows/_app-build.yml
    with:
      app: NetworkTrayAppDotNET
