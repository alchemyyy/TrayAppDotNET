name: Fan Control Release

on:
  workflow_dispatch:
    inputs:
      package_artifact_name:
        description: Optional package artifact name.
        required: false
        type: string
      tray_version:
        description: Aggregate TrayAppDotNET version, passed through for consistency with publish runs.
        required: false
        type: string
      force_rebuild:
        description: Build even if an existing release asset could be reused.
        required: false
        default: false
        type: boolean
      publish_staging_root:
        description: Optional local package staging root.
        required: false
        type: string
  workflow_call:
    inputs:
      package_artifact_name:
        required: false
        type: string
        default: ""
      tray_version:
        required: false
        type: string
        default: ""
      force_rebuild:
        required: false
        type: boolean
        default: false
      publish_staging_root:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  release:
    name: FanControlTrayAppDotNET Release
    runs-on: [self-hosted, Windows, X64, trayapp]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Submodules are checked out manually below.
          # actions/checkout updates submodules before stale self-hosted runner
          # config can be cleared.
          submodules: false

      - name: Add Git Bash To PATH
        shell: cmd
        run: |
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\bin
          >> "%GITHUB_PATH%" echo C:\Program Files\Git\usr\bin

      - name: Checkout Submodules
        run: |
          set -euo pipefail

          # Clear cached submodule config from reused self-hosted workspaces.
          # --checkout forces the recorded commit instead of merge/rebase.
          git submodule deinit --force --all
          git submodule sync --recursive
          git submodule update --init --force --checkout --recursive
          # Existing self-hosted workspaces may have shallow submodule repositories.
          git submodule foreach --recursive '
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow --tags
            fi
          '

      - name: Verify Release Toolchain
        run: |
          set -euo pipefail

          command -v dotnet
          command -v gh
          if ! command -v python3 >/dev/null 2>&1 && ! command -v python >/dev/null 2>&1; then
            echo "python3 or python is required." >&2
            exit 1
          fi
          dotnet --info
          dotnet --list-sdks | grep -E '^10\.'

      - name: Build Release Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python_bin="python"
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          fi

          args_list=(
            ".github/scripts/publish.py"
            "--phase" "build-app-profile"
            "--profile" "release"
            "--app-name" "FanControlTrayAppDotNET"
            "--repo" "$GITHUB_REPOSITORY"
            "--output-root" ".artifacts/publish"
          )

          if [ "${{ inputs.tray_version }}" != "" ]; then
            args_list+=("--tray-version" "${{ inputs.tray_version }}")
          fi

          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            args_list+=("--force-rebuild")
          fi

          "$python_bin" "${args_list[@]}"

      - name: Stage Release Package Locally
        id: stage-release-package
        if: ${{ inputs.publish_staging_root != '' }}
        # Local staging is a best-effort optimization for publish fan-in.
        # Upload still runs if staging fails.
        continue-on-error: true
        run: |
          set -euo pipefail

          python_bin="python"
          if command -v python3 >/dev/null 2>&1; then
            python_bin="python3"
          fi

          "$python_bin" .github/scripts/publish.py \
            --phase stage-app-profile \
            --profile release \
            --app-name "FanControlTrayAppDotNET" \
            --repo "$GITHUB_REPOSITORY" \
            --output-root .artifacts/publish \
            --stage-root "${{ inputs.publish_staging_root }}"

      - name: Upload Release Package Artifact
        if: ${{ inputs.publish_staging_root == '' || steps.stage-release-package.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package_artifact_name || format('fan-control-tray-app-package-{0}', github.run_id) }}
          path: .artifacts/publish/release/packages/**
          if-no-files-found: error
          retention-days: 14
